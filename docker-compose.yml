name: voice-shopping-agents

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: voice-shopping-agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice-shopping-agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
