name: Publish demo video

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare site
        shell: bash
        env:
          VIDEO_URL: https://voice-shopping-agents.oss-cn-beijing.aliyuncs.com/Desktop%202026.08.06%20-%2019.55.25.06.mp4
        run: |
          set -euo pipefail
          mkdir -p site
          curl --fail --location --retry 3 --output site/demo.mp4 "$VIDEO_URL"
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>声选 Agent 演示视频</title>
            </head>
            <body>
              <video controls preload="metadata" width="100%" src="demo.mp4">
                <a href="demo.mp4">下载演示视频</a>
              </video>
            </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
