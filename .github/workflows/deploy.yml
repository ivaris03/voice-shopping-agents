name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/ivaris03/voice-shopping-agents
  VITE_API_BASE_URL: https://voice.ivaris.top/api/v1
  VITE_TEXT_WS_URL: wss://voice.ivaris.top/ws/text
  VITE_AUDIO_WS_URL: wss://voice.ivaris.top/ws/audio
  VITE_MERCHANT_WEB_URL: https://voice.ivaris.top/merchant/
  VITE_PLATFORM_WEB_URL: https://voice.ivaris.top/platform/

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ci-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontends
        run: |
          pnpm typecheck
          pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install API dependencies
        run: uv sync --project apps/api --dev --frozen

      - name: Lint and test API
        run: |
          uv run --project apps/api ruff check .
          uv run --project apps/api pytest -c apps/api/pyproject.toml -m "not e2e"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      VOICE_SHOPPING_ENVIRONMENT: test
      VOICE_SHOPPING_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_shopping_agents
      VOICE_SHOPPING_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_shopping_agents_e2e
      VOICE_SHOPPING_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: voice_shopping_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voice_shopping_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install API dependencies
        run: uv sync --project apps/api --dev --frozen

      - name: Prepare isolated E2E database
        run: pnpm db:prepare-e2e

      - name: Run API E2E tests
        run: pnpm test:e2e

  build-api:
    name: Build API image
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build ${{ matrix.app }} frontend image
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant, platform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_TEXT_WS_URL=${{ env.VITE_TEXT_WS_URL }}
            VITE_AUDIO_WS_URL=${{ env.VITE_AUDIO_WS_URL }}
            VITE_MERCHANT_WEB_URL=${{ env.VITE_MERCHANT_WEB_URL }}
            VITE_PLATFORM_WEB_URL=${{ env.VITE_PLATFORM_WEB_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          port="${SERVER_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/voice-shopping-deploy"
          chmod 600 "$HOME/.ssh/voice-shopping-deploy"
          ssh-keyscan -p "$port" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          port="${SERVER_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/voice-shopping-agents}"
          ssh -i "$HOME/.ssh/voice-shopping-deploy" -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$deploy_path/deploy/nginx'"
          scp -i "$HOME/.ssh/voice-shopping-deploy" -P "$port" \
            deploy/docker-compose.prod.yml \
            deploy/install-nginx.sh \
            deploy/remote-deploy.sh \
            deploy/smoke-test.sh \
            "$SERVER_USER@$SERVER_HOST:$deploy_path/deploy/"
          scp -i "$HOME/.ssh/voice-shopping-deploy" -P "$port" \
            deploy/nginx/ivaris.top.conf \
            "$SERVER_USER@$SERVER_HOST:$deploy_path/deploy/nginx/"

      - name: Install and reload Nginx configuration
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          port="${SERVER_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/voice-shopping-agents}"
          ssh -i "$HOME/.ssh/voice-shopping-deploy" -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='$deploy_path' bash '$deploy_path/deploy/install-nginx.sh'"

      - name: Upload production API secrets
        shell: bash
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          : "${DASHSCOPE_API_KEY:?Missing production secret DASHSCOPE_API_KEY}"
          : "${LANGSMITH_API_KEY:?Missing production secret LANGSMITH_API_KEY}"

          port="${SERVER_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/voice-shopping-agents}"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          umask 077

          {
            printf 'DASHSCOPE_API_KEY=%s\n' "$DASHSCOPE_API_KEY"
            printf 'LANGSMITH_API_KEY=%s\n' "$LANGSMITH_API_KEY"
          } > "$secret_file"

          ssh -i "$HOME/.ssh/voice-shopping-deploy" -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "set -Eeuo pipefail
            umask 077
            secret_file='$deploy_path/.env.secrets.tmp'
            cat > \"\$secret_file\"
            chmod 600 \"\$secret_file\"
            mv -f \"\$secret_file\" '$deploy_path/.env.secrets'" < "$secret_file"

      - name: Pull and restart production services
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          port="${SERVER_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/voice-shopping-agents}"
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/voice-shopping-deploy" -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "set -Eeuo pipefail
            docker_config=\$(mktemp -d)
            trap 'rm -rf \"\$docker_config\"' EXIT
            export DOCKER_CONFIG=\"\$docker_config\"
            docker login ghcr.io --username '$GHCR_USER' --password-stdin
            cd '$deploy_path'
            IMAGE_PREFIX='$IMAGE_PREFIX' DEPLOY_PATH='$deploy_path' bash deploy/remote-deploy.sh 'sha-${GITHUB_SHA}'"

      - name: Verify production routing
        shell: bash
        run: bash deploy/smoke-test.sh
