[project]
name = "voice-shopping-api"
version = "0.1.0"
description = "FastAPI backend for the voice shopping platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "dashscope>=1.25.6",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "langchain>=0.3.27",
  "langchain-community>=0.4.2",
  "langchain-qwq>=0.3.5",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-postgres>=3.1.0",
  "langsmith>=0.10.15",
  "pydantic-settings>=2.10.0",
  "PyJWT>=2.10.1",
  "redis>=6.2.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "uvicorn[standard]>=0.36.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_shopping_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "contract: HTTP API contract tests",
  "service: business service tests",
  "e2e: end-to-end tests requiring external services",
]
# 数据库集成测试：模块级 fixture 与用例共享同一个事件循环，
# 避免 asyncpg 连接跨循环使用报 "another operation is in progress"。
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
