map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream voice_shopping_api {
    server 127.0.0.1:18000;
}

upstream voice_shopping_user_web {
    server 127.0.0.1:18001;
}

upstream voice_shopping_merchant_web {
    server 127.0.0.1:18002;
}

upstream voice_shopping_platform_web {
    server 127.0.0.1:18003;
}

server {
    listen 80;
    server_name voice.ivaris.top;

    location / {
        proxy_pass http://voice_shopping_user_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name merchant.ivaris.top;

    location / {
        proxy_pass http://voice_shopping_merchant_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name platform.ivaris.top;

    location / {
        proxy_pass http://voice_shopping_platform_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.ivaris.top;

    client_max_body_size 25m;

    location /ws/ {
        proxy_pass http://voice_shopping_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://voice_shopping_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
