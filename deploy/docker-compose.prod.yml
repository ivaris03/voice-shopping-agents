services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_shopping_agents}
      POSTGRES_USER: ${POSTGRES_USER:-voice_shopping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
      shared_database:
        aliases:
          - ivaris-postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.secrets
    environment:
      VOICE_SHOPPING_ENVIRONMENT: production
      LANGSMITH_PROJECT: voice-shopping-agents
      LANGSMITH_TRACING: "true"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  user-web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/user-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18001:80"

  merchant-web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/merchant-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18002:80"

  platform-web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/platform-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18003:80"

volumes:
  postgres_data:
  redis_data:

networks:
  shared_database:
    name: ivaris-shared
    external: true
